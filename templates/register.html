{% extends 'base.html' %}
{% block title %}Register | Bonnyrigg Pizza Blog{% endblock %}
{% block content %}
<section class="auth-wrap">
    <div class="container auth-card">
        <div class="auth-promo"><span class="kicker">Join the Community</span><h2>Create an account</h2><p>Register to join the pizza blog and use the website like a real community platform.</p></div>
        <div class="auth-form">
            <h2 style="margin-top:0;">Register</h2>
            <form method="POST" class="form-stack">
                <input name="username" placeholder="Username" required>
                <input name="email" type="email" placeholder="Email address" required>
                <input name="password" type="password" placeholder="Password" required>
                <button type="submit">Create Account</button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
