{% extends 'base.html' %}
{% block title %}Set New Password | Bonnyrigg Pizza Blog{% endblock %}
{% block content %}
<section class="auth-wrap">
    <div class="container auth-card">
        <div class="auth-promo">
            <span class="kicker">Create a new password</span>
            <h2>Your verification was successful</h2>
            <p>Set your new password below to complete the reset process.</p>
        </div>
        <div class="auth-form">
            <h2 style="margin-top:0;">New password</h2>
            <form method="POST" class="form-stack">
                <input name="password" type="password" placeholder="New password" required>
                <input name="confirm_password" type="password" placeholder="Confirm new password" required>
                <button type="submit">Save new password</button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
